name: Build-VidPlayer-APK

# 触发条件：推送到 main/master 分支自动编译；也可在 Actions 页面手动 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 首次要编译 FFmpeg，预留 6 小时上限

    steps:
      # 1. 拉取仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. Python 3.10（buildozer 宿主环境，与手机内 Python 无关）
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # 3. 缓存 Android SDK/NDK 与 p4a 构建产物，第二次构建会快很多
      - name: 缓存 buildozer 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 4. 系统依赖（python-for-android / FFmpeg 编译需要）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-venv \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libstdc++6 libffi-dev libssl-dev \
            build-essential ccache cmake wget xz-utils ca-certificates

      # 5. 打包前先做 Python 语法自检，代码有语法错误时 2 秒内失败，不用等编译
      - name: 代码语法自检
        run: |
          python -m py_compile main.py vidcore.py vidutil.py
          echo "语法自检通过"
          test -f fonts/ZCOOLKuaiLe-Regular.ttf && echo "字体文件在位"
          test -f buildozer.spec && echo "buildozer.spec 在位"

      # 6. 在独立虚拟环境中安装 buildozer（避免与系统包冲突导致安装失败）
      - name: 安装 buildozer 与 Cython
        run: |
          python -m venv $HOME/venv
          source $HOME/venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          # 新版 p4a 的 kivy/pyjnius 配方需要 Cython 3.x（kivy 配方要求 <=3.0.12）
          pip install --retries 5 --timeout 60 \
            "Cython==3.0.12" "buildozer==1.6.0" virtualenv \
            || pip install --retries 5 --timeout 60 \
            "Cython==3.0.12" buildozer virtualenv
          python -m pip list
          buildozer version

      # 7. 正式打包 APK（首次约 30~90 分钟，需下载 SDK/NDK 并编译 FFmpeg）
      #    注：新版 p4a 的 freetype 已改用 savannah 官方镜像源，不再需要预下载兜底。
      #    最多自动重试 3 轮，已下载的内容有缓存，重试不会从零开始
      - name: 打包 APK
        run: |
          source $HOME/venv/bin/activate
          export BUILDOZER_WARN_ON_ROOT=1
          for i in 1 2 3; do
            echo "=========== 第 $i 次构建尝试 ==========="
            if yes | buildozer -v android debug; then
              echo "=========== 构建成功 ==========="; exit 0
            fi
            echo "第 $i 次未成功，15 秒后利用缓存重试..."
            sleep 15
          done
          echo "三次构建均失败"; exit 1

      # 8. 上传 APK，构建成功后在该运行页面的 Artifacts 处下载
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: VidPlayer-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      # 9. 失败时自动打印关键日志，方便定位
      - name: 失败时输出关键日志
        if: failure()
        run: |
          echo "================ buildozer.spec ================"
          cat buildozer.spec
          echo "================ 所有 .log 文件内容（尾部） ================"
          # 新版 p4a 的构建目录形如 build-<archs>/，主日志不在固定路径下，
          # 用 find 动态定位后逐个打印尾部，避免硬编码错误路径而抓不到日志。
          for f in $(find .buildozer ~/.buildozer -type f -name "*.log" 2>/dev/null | sort); do
            echo ""
            echo "================ $f ================"
            tail -n 80 "$f"
          done
          echo ""
          echo "================ ffmpeg ffbuild/config.log（configure 失败关键） ================"
          for f in $(find .buildozer ~/.buildozer -path "*ffmpeg*" -name "config.log" 2>/dev/null); do
            echo "================ $f ================"
            tail -n 60 "$f"
          done
